
/**/controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    tricycle_controller:
      type: tricycle_controller/TricycleController
    # fork_controller:
    #   type: position_controllers/JointGroupPositionController

/**/tricycle_controller:
  ros__parameters:
    # Ведущее колесо
    traction_joint_name: "J_main_wheel"
    # Поворотный механизм ведущего колеса
    steering_joint_name: "J_main_wheel_rotate"
    # База между управляемым колесом и задней осью
    wheelbase: 1.206
    # Радиус ведущего колеса
    wheel_radius: 0.105
    # ======================================================
    # ПУБЛИКАЦИЯ
    # ======================================================
    # Частота публикации одометрии
    publish_rate: 100.0
    # Использовать cmd_vel как TwistStamped
    use_stamped_vel: true
    # Использовать симуляционное время Gazebo
    use_sim_time: true
    # ======================================================
    # TF И ОДОМЕТРИЯ
    # ======================================================
    # Главный фрейм робота
    base_frame_id: base_link
    # Фрейм одометрии
    odom_frame_id: odom
    # Публикация TF:
    # odom -> base_link
    enable_odom_tf: false
    # Одометрия вычисляется по командам управления,
    # а не по энкодерам
    open_loop: false
    # Не только скорость, но и интеграция позиции
    odom_only_twist: false
    # Таймаут команд управления (мс)
    cmd_vel_timeout: 500
    # Публиковать ограниченную Ackermann-команду
    publish_ackermann_command: false
    # Размер окна усреднения скоростей
    velocity_rolling_window_size: 100
    # ======================================================
    # КОВАРИАЦИЯ ПОЗИЦИИ
    # ======================================================
    # x, y, z, roll, pitch, yaw
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    # ======================================================
    # КОВАРИАЦИЯ СКОРОСТИ
    # ======================================================
    # vx, vy, vz, wx, wy, wz
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

