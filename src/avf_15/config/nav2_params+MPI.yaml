amcl:
  ros__parameters:
    alpha1: 0.35
    alpha2: 0.35
    alpha3: 0.25
    alpha4: 0.35
    alpha5: 0.2
    use_sim_time: true
    base_frame_id: base_link
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 360
    max_particles: 5000
    min_particles: 1000
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    #robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.01
    update_min_d: 0.01
    z_hit: 0.8
    z_max: 0.05
    z_rand: 0.2
    z_short: 0.05
    scan_topic: /livox/scan_low
    set_initial_pose: true
    initial_pose:
      x: 1.0
      y: 1.0
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_name_prefixes:
      - assisted_teleop
      - backup
      - compute_path
      - dock_robot
      - drive_on_heading
      - follow_path
      - nav_thru_poses
      - nav_to_pose
      - route
      - spin
      - undock_robot
      - wait

controller_server:
  ros__parameters:
    use_sim_time: true

    controller_frequency: 20.0
    costmap_update_timeout: 0.3

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    odom_topic: /odometry/filtered
    enable_stamped_cmd_vel: true

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 20.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.30

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # ---------------------------------
      # Prediction horizon
      # 56 * 0.05 = 2.8 seconds
      # ---------------------------------

      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      iteration_count: 1

      # ---------------------------------
      # Sampling
      # ---------------------------------

      vx_std: 0.20
      vy_std: 0.0
      wz_std: 0.20

      # ---------------------------------
      # Velocity constraints
      # ---------------------------------

      vx_max: 1.0
      vx_min: -0.8
      vy_max: 0.0
      wz_max: 0.50

      # ---------------------------------
      # Acceleration constraints
      # ---------------------------------

      ax_max: 1.30
      ax_min: -1.50

      ay_max: 0.0
      ay_min: 0.0

      az_max: 1.0

      # ---------------------------------
      # Optimization
      # ---------------------------------

      temperature: 0.3
      gamma: 0.015
      prune_distance: 3.0

      transform_tolerance: 0.3
      regenerate_noises: false
      visualize: false
      sgf_order: 2
      open_loop: false

      # ---------------------------------
      # Ackermann model
      # ---------------------------------

      motion_model: "Ackermann"

      Ackermann:
        plugin: "mppi::AckermannMotionModel"
        min_turning_r: 1.2

      # ---------------------------------
      # Final trajectory validation
      # ---------------------------------

      TrajectoryValidator:
        plugin: "mppi::DefaultOptimalTrajectoryValidator"
        collision_lookahead_time: 2.0
        consider_footprint: true

      # ---------------------------------
      # Critics
      # ---------------------------------

      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.15
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: true

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 2

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        threshold_to_consider: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      footprint: "[
        [1.40, 0.55],
        [1.40, -0.15],
        [-0.30, -0.15],
        [-0.30, 0.55]
      ]"
      #plugins: ["voxel_layer", "inflation_layer", "obstacle_layer"]
      plugins: ["obstacle_layer", "voxel_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true  
        footprint_clearing_enabled: true
        observation_sources: livox_low livox_middle
        livox_low:
          topic: /livox/scan_low
          data_type: LaserScan
          clearing: true
          marking: true
          observation_persistence: 0.2
          expected_update_rate: 0.0
          obstacle_min_range: 0.2
          obstacle_max_range: 5.0
          raytrace_min_range: 0.2
          raytrace_max_range: 6.0
          inf_is_valid: true

        livox_middle:
          topic: /livox/scan_middle
          data_type: LaserScan
          clearing: true
          marking: true
          observation_persistence: 0.2
          expected_update_rate: 0.0
          obstacle_min_range: 0.2
          obstacle_max_range: 5.0
          raytrace_min_range: 0.2
          raytrace_max_range: 6.0
          inf_is_valid: true

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        footprint_clearing_enabled: true
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.20
        z_voxels: 16
        max_obstacle_height: 3.0
        mark_threshold: 0
        observation_sources: livox_cloud
        # 0. 2D LiDAR
        # scan:
        #   # A relative topic will be appended to the parent of the local_costmap namespace.
        #   # For example:
        #   #   * User chosen namespace is `tb4`.
        #   #   * User chosen topic is `scan`.
        #   #   * Topic will be remapped to `/tb4/scan` without `local_costmap`.
        #   #   * Use global topic `/scan` if you do not wish the node namespace to apply
        #   topic: scan
        #   max_obstacle_height: 2.0
        #   clearing: false
        #   marking: true
        #   data_type: "LaserScan"
        #   raytrace_max_range: 3.0
        #   raytrace_min_range: 0.0
        #   obstacle_max_range: 2.5
        #   obstacle_min_range: 0.0

        # 1. 3D LiDAR Livox Mid-360
        livox_cloud:
          topic: /livox/points      # Проверьте имя вашего топика (может быть /livox/points)
          data_type: "PointCloud2"
          min_obstacle_height: 0.1   # Игнорируем отражения от пола
          max_obstacle_height: 2.0   # Препятствия выше робота не учитываем
          obstacle_max_range: 4.5    # Обсчитываем препятствия в радиусе 4.5 метров
          obstacle_min_range: 0.1
          raytrace_max_range: 5.0    # Стираем ушедшие препятствия до 5 метров
          raytrace_min_range: 0.1
          clearing: true
          marking: true

        # 2. Передняя камера глубины
        front_camera:
          topic: /front_depth_camera/points  # Укажите ваш топик PointCloud2 передней камеры
          data_type: "PointCloud2"
          min_obstacle_height: 0.15  # Отсекаем шум пола и блики
          max_obstacle_height: 2.0
          obstacle_max_range: 3.5    # Камеры глубины на улице/в симуляции точны до 3-4 метров
          obstacle_min_range: 0.2
          raytrace_max_range: 4.0
          raytrace_min_range: 0.2
          clearing: true
          marking: true

        # 3. Задняя камера глубины (чтобы не врезаться при движении назад/разворотах)
        back_camera:
          topic: /rear_depth_camera/points   # Укажите ваш топик PointCloud2 задней камеры
          data_type: "PointCloud2"
          min_obstacle_height: 0.15
          max_obstacle_height: 2.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.2
          raytrace_max_range: 4.0
          raytrace_min_range: 0.2
          clearing: true
          marking: true

        livox_low:
          topic: /livox/scan_low
          data_type: LaserScan
          clearing: true
          marking: true
          observation_persistence: 0.2
          expected_update_rate: 0.0
          obstacle_min_range: 0.2
          obstacle_max_range: 7.0
          raytrace_min_range: 0.2
          raytrace_max_range: 8.0
          inf_is_valid: true

        livox_middle:
          topic: /livox/scan_middle
          data_type: LaserScan
          clearing: true
          marking: true
          observation_persistence: 0.2
          expected_update_rate: 0.0
          obstacle_min_range: 0.2
          obstacle_max_range: 7.0
          raytrace_min_range: 0.2
          raytrace_max_range: 8.0
          inf_is_valid: false

        livox_high:
          topic: /livox/scan_high
          data_type: LaserScan
          clearing: true
          marking: true
          observation_persistence: 0.2
          expected_update_rate: 0.0
          obstacle_min_range: 0.2
          obstacle_max_range: 7.0
          raytrace_min_range: 0.2
          raytrace_max_range: 8.0
          inf_is_valid: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.2
        footprint_clearing_enabled: true
        inflation_radius: 1.55    
        
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      always_send_full_costmap: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[
        [1.40, 0.55],
        [1.40, -0.15],
        [-0.30, -0.15],
        [-0.30, 0.55]
      ]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: livox_low livox_middle
        footprint_clearing_enabled: true
        # scan:
        #   # A relative topic will be appended to the parent of the global_costmap namespace.
        #   # For example:
        #   #   * User chosen namespace is `tb4`.
        #   #   * User chosen topic is `scan`.
        #   #   * Topic will be remapped to `/tb4/scan` without `global_costmap`.
        #   #   * Use global topic `/scan` if you do not wish the node namespace to apply
        #   topic: scan
        #   max_obstacle_height: 2.0
        #   clearing: True
        #   marking: True
        #   data_type: "LaserScan"
        #   raytrace_max_range: 3.0
        #   raytrace_min_range: 0.0
        #   obstacle_max_range: 2.5
        #   obstacle_min_range: 0.0

        livox:
          topic: /livox/points 
          data_type: "PointCloud2"
          marking: True
          clearing: True
          obstacle_max_range: 5.0
          obstacle_min_range: 0.1
          raytrace_max_range: 6.0
          raytrace_min_range: 0.1
          max_obstacle_height: 2.5
          min_obstacle_height: 0.05

        livox_low:
          topic: /livox/scan_low
          data_type: LaserScan
          clearing: true
          marking: true
          observation_persistence: 0.2
          expected_update_rate: 0.25
          obstacle_min_range: 0.2
          obstacle_max_range: 7.0
          raytrace_min_range: 0.2
          raytrace_max_range: 8.0
          inf_is_valid: true

        livox_middle:
          topic: /livox/scan_middle
          data_type: LaserScan
          clearing: true
          marking: true
          observation_persistence: 0.2
          expected_update_rate: 0.25
          obstacle_min_range: 0.2
          obstacle_max_range: 7.0
          raytrace_min_range: 0.2
          raytrace_max_range: 8.0
          inf_is_valid: false

        livox_high:
          topic: /livox/scan_high
          data_type: LaserScan
          clearing: false
          marking: true
          observation_persistence: 0.2
          expected_update_rate: 0.25
          obstacle_min_range: 0.2
          obstacle_max_range: 7.0
          raytrace_min_range: 0.2
          raytrace_max_range: 8.0
          inf_is_valid: false
      
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.2
        inflation_radius: 1.55
      always_send_full_costmap: True

slam_toolbox:
  ros__parameters:
    use_sim_time: true
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: /livox/scan_low

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    # Переключаем плагин на гибридный SmacPlanner для Аккермана
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 0.25                      # Допуск до конечной точки (метров)
      allow_unknown: true                 # Разрешить строить путь через неизведанные зоны
      
      # КИНЕМАТИЧЕСКИЕ ПАРАМЕТРЫ ПОГРУЗЧИКА:
      minimum_turning_radius: 1.2       # Минимальный радиус разворота вашего робота (в метрах)
      motion_model_for_search: "REEDS_SHEPP" # REEDS_SHEPP (вперед и назад) или DUBIN (только вперед)
      
      # Настройки сетки планирования:
      angle_quantization_bins: 72           # Дискретизация углов (72 = шаги по 5 градусов)
      max_iterations: 100000            # Максимум итераций для поиска пути
      max_on_approach_iterations: 1000    # Итерации при приближении к цели
      max_planning_time: 10.0
      smooth_path: true                   # Дополнительно сглаживать траекторию
      
      # Штрафы за маневры (помогают сделать движение более логичным):
      change_penalty: 0.0                 # Штраф за смену направления руля
      non_straight_penalty: 1.14          # Штраф за движение по дуге вместо прямой
      reverse_penalty: 1.3                # Штраф за движение задним ходом (чтобы робот предпочитал ехать передом)
      
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 6.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false


      # Настройки встроенного оптимизатора траектории Smac Planner
      smoother:

        # Максимальное количество итераций оптимизации.
        # Большее значение может улучшить сглаживание, но увеличивает время планирования.
        max_iterations: 1000

        # Вес гладкости траектории.
        # Чем выше значение, тем сильнее оптимизатор старается убрать резкие изгибы.
        # Слишком большое значение может привести к чрезмерному срезанию поворотов.
        w_smooth: 0.4

        # Вес сохранения исходной формы траектории.
        # Чем выше значение, тем ближе сглаженный путь остаётся к пути,
        # найденному Hybrid-A* до сглаживания.
        w_data: 0.3

        # Вес стоимости ячеек costmap при сглаживании.
        # 0.0 означает, что оптимизатор не использует стоимость costmap
        # при изменении формы траектории.
        # Проверка столкновений при этом не обязательно отключается.
        w_costmap: 0.2

smoother_server:
  ros__parameters:
    use_sim_time: true

    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"

      tolerance: 1.0e-6
      max_its: 200
      do_refinement: false

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    enable_stamped_cmd_vel: true

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [1.0, 0.0, 1.0]
    min_velocity: [-1.20, 0.0, -1.45]
    max_accel: [1.30, 0.0, 1.5]
    max_decel: [-1.50, 0.0, -1.5]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: true

collision_monitor:
  ros__parameters:
    use_sim_time: true
    enabled: true
    base_frame_id: base_link
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    #cmd_vel_out_topic: "/cmd_vel"
    cmd_vel_out_topic: "/tricycle_controller/cmd_vel"
    enable_stamped_cmd_vel: true
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.

    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True

    observation_sources: ["livox_low" ,"livox_middle"]
    # scan:
    #   type: "scan"
    #   topic: "scan"
    #   min_height: 0.15
    #   max_height: 2.0
    #   enabled: True

    livox_low:
      type: "scan"
      topic: /livox/scan_low
      enabled: true

    livox_middle:
      type: "scan"
      topic: /livox/scan_middle
      enabled: true

docking_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 15.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: base_link
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "/local_costmap/costmap_raw"
      footprint_topic: "/local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

loopback_simulator:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan"  # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02
    enable_stamped_cmd_vel: true

route_server:
  ros__parameters:
    use_sim_time: true
    base_frame: base_link
    route_frame: "map"
    path_density: 0.05
    smooth_corners: true
    smoothing_radius: 2.0
    max_planning_time: 2.0

    graph_filepath: "/home/asolovyev/navigation2_tutorials/avf_15/graphs/route.geojson"

    planner_plugin: "DefaultRoutePlanner"
    edge_cost_function: "DistanceScorer"

    DefaultRoutePlanner:
      plugin: "nav2_route::RoutePlanner"

    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"